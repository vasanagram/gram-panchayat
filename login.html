<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{

margin:0;

font-family:Arial,sans-serif;

background:#f4f4f4;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login-box{

width:360px;

background:#fff;

padding:30px;

border-radius:12px;

box-shadow:0 5px 20px rgba(0,0,0,.15);

text-align:center;

}

.login-box h2{

margin-bottom:25px;

color:#ff6b00;

}

.login-box input{

width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ccc;

border-radius:8px;

box-sizing:border-box;

font-size:16px;

}

.login-box button{

width:100%;

padding:12px;

background:#ff6b00;

color:#fff;

border:none;

border-radius:8px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

.login-box button:hover{

background:#e85d00;

}

#error{

margin-top:15px;

color:red;

font-size:15px;

}

</style>

</head>

<body>

<div class="login-box">

<h2>ગ્રામ પંચાયત Admin Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</form>

<p id="error"></p>

</div>

<script type="module" src="login.js"></script>

</body>

</html>
